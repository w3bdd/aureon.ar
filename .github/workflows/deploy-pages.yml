name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      # Empty BACKEND_URL => static mode: the contact form uses Web3Forms
      # (if the repo variable is set) or a pre-filled mailto fallback.
      - run: yarn build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
          REACT_APP_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
